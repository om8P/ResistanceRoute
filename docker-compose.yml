services:
  neo4j:
    image: neo4j:5-community
    container_name: amr-navigator-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-amrnavigator}"
    volumes:
      - amr_navigator_neo4j_data:/data

volumes:
  amr_navigator_neo4j_data:

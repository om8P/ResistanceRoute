# AMR-Navigator scope: the entities the graph covers (task T03).
#
# Educational reference data, not clinical advice. No doses.
#
# id_verified meanings used in this file:
#   pathogens  - NCBI Taxonomy ID for the species.
#   mechanisms - CARD ARO accession of the AMR gene family, read on card.mcmaster.ca on
#                2026-11-17 and confirmed against data/raw/card/ontology/aro.obo (CARD
#                ontology v4.0.2, dated 2026-08-11) on 2026-11-18. LOCAL: IDs are false
#                (CARD has no family term for them).
#   drugs      - ATC code confirmed on the WHOCC ATC/DDD index (atcddd.fhi.no, index updated
#                2026-01-20) AND the drug found with that ATC code and the same aware_group in
#                data/raw/aware/WHO-AWaRe-classification-2025.xlsx (checked 2026-11-18).
#                Where AWaRe splits one ATC code by route (minocycline, fosfomycin) the IV
#                group is used. sulbactam-durlobactam is in neither the 2023 nor the 2025
#                AWaRe list, so it is false although its ATC code is confirmed on WHOCC.
#
# Drug classes are reasoning classes (DECISIONS.md D6), not the ATC hierarchy. Drugs whose
# class differs from the ATC/AWaRe grouping are listed with reasons in schema/class_overrides.csv.


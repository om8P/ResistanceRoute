# Section map for the PDF guidelines (task T06, read by pipeline/ingest.py).
#
# pages: [first, last] are 1-based PDF pages, inclusive. printed page = PDF page - page_offset.
# A section ends where the next section starts. When two sections share a page, the later one
# carries start_heading: the section starts at the first line of its first page that begins
# with that text (compared without spaces, case or punctuation, because the ICMR 2022 PDF has
# stray spaces inside words).
# skip: true means the section is read for boundaries only and produces no passages.
# Slugs: lower-case letters, digits and hyphens. They become the middle part of passage IDs
# (<source doc id>:<section slug>:<n>), so changing one renames every passage in it.
#
# extract: x_tolerance_ratio sets how wide a gap between letters must be, relative to the font
#   size, before pdfplumber inserts a space. crop = [top, bottom] points removed from every
#   page (running header and footer). columns: auto splits a page at its middle when no word
#   crosses the middle line (the AWaRe infographic pages are two columns).
# strip_references: drop the "References" list that closes a sub-chapter, up to the next
#   numbered heading (ICMR 2019 prints its references inside the chapters).
# tables: tables to read with pdfplumber's table finder and turn into one sentence per row.

